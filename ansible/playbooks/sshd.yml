---
- name: Configure sshd
  hosts: lab
  become: true

  tasks:
    - name: Set LoginGraceTime
      ansible.builtin.copy:
        content: "LoginGraceTime 40\n"
        dest: /etc/ssh/sshd_config.d/lab.conf
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
